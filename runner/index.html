<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#06245e" />
<meta name="description" content="NearBuy Runner Portal — accept nearby delivery offers, collect with the shop handover PIN and complete deliveries with the customer's OTP." />
<title>Runner Portal · NearBuy</title>
<link rel="icon" href="/public/assets/nearbuy-logo.png" />
<link rel="stylesheet" href="/partner/app.css" />

<body>
<div class="shell" aria-busy="true">
  <aside class="side">
    <span class="brand"><img src="/public/assets/nearbuy-logo.png" alt="NearBuy" width="40" height="40" />
      <span><b>NearBuy</b><span>Runner Portal</span></span></span>
  </aside>
  <div class="main">
    <header class="topbar"><span class="title">Runner Portal</span></header>

      <div class="card"><div class="skeleton line" style="width:35%"></div><div class="skeleton line" style="width:65%"></div><div class="skeleton line" style="width:50%"></div></div>

  <div class="card" style="margin:24px">
    <h1>Runner Portal needs JavaScript</h1>
    <p>Delivery offers and OTP verification run through the shared NearBuy API. Enable JavaScript,
      or use <a href="/portal.html#/deliver/overview">the offline demo shell</a>.</p>
  </div>

<script src="/partner/core.js"></script>
<script src="/partner/runner.js"></script>
