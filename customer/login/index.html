<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#06245e" />
<title>Sign in · NearBuy</title>
<link rel="icon" href="/public/assets/nearbuy-logo.png" />
<meta http-equiv="refresh" content="0; url=/customer/#/login" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(900px 420px at 12% -10%, #1468B8 0, transparent 60%), linear-gradient(160deg, #082D5C, #063B78);
    color: #142D4B; font: 400 16px/1.6 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  main { width: min(460px, 100%); background: #fff; border-radius: 22px; padding: 38px 32px; text-align: center; box-shadow: 0 30px 70px rgba(3, 22, 44, .35); }
  .mark { width: 84px; height: 84px; margin: 0 auto 16px; display: grid; place-items: center; background: #EFF7FF; border-radius: 22px; }
  .mark img { width: 64px; height: 64px; object-fit: contain; }
  .kicker { display: inline-block; font: 800 10.5px/1 'DM Sans', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #0866D9; margin-bottom: 12px; }
  h1 { font: 800 28px/1.15 'DM Sans', sans-serif; color: #082D5C; margin: 0 0 8px; letter-spacing: -.02em; }
  p { margin: 0 auto 22px; max-width: 34ch; color: #5B7590; font-size: 14px; }
  a.cta { display: inline-block; padding: 13px 26px; border-radius: 11px; text-decoration: none; background: #0866D9; color: #fff; font-weight: 700; box-shadow: 0 10px 24px rgba(8, 102, 217, .28); }
  a.cta:hover { background: #063B78; }
  .creds { margin: 22px auto 0; padding: 12px 14px; max-width: 330px; background: #FFF9EC; border: 1px dashed #E8CFA0; border-radius: 12px; font-size: 12.5px; color: #7C5A1E; text-align: left; }
  .creds b { display: block; margin-bottom: 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #8A5900; }
  .creds code { display: block; font-family: ui-monospace, monospace; color: #082D5C; }
  .home { display: inline-block; margin-top: 16px; font-size: 12.5px; color: #5B7590; text-decoration: none; }
  .home:hover { color: #063B78; }
</style>
<link rel="stylesheet" href="/public/assets/brand.css" />
</head>
<body>
<main>
  <span class="mark"><img src="/public/assets/nearbuy-logo.png" width="64" height="64" alt="NearBuy" /></span>
  <span class="kicker">Customer sign-in</span>
  <h1>Opening your account</h1>
  <p>Your orders, saved addresses, wishlist and support tickets live in the NearBuy customer portal.</p>
  <a class="cta" href="/customer/#/login">Continue to sign in</a>
  <div class="creds"><b>Demo account</b><code>customer@nearbuy.demo</code><code>Customer123!</code></div>
  <a class="home" href="/">&larr; Back to NearBuy home</a>
  <noscript><p style="margin-top:18px"><a href="/customer/#/login">Use this link to continue</a></p></noscript>
</main>
<script>location.replace('/customer/#/login');</script>
</body>
</html>
